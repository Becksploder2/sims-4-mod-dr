name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install packager
        run: python -m pip install pyinstaller==6.16.0
      - name: Build desktop app
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Sims4ModDoctor mod_doctor.py
      - uses: actions/upload-artifact@v4
        with:
          name: Sims4ModDoctor-Windows
          path: dist/Sims4ModDoctor.exe
